<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/stages/stage1_clothed.png">
<title>Kenji's Village Hunt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 6px 0;
    color: #ff6b6b;
    text-align: center;
  }
  .subtitle {
    color: #aaa;
    margin-bottom: 10px;
    text-align: center;
    font-size: 0.85rem;
  }
  .game-container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }
  .character-panel { 
    flex: 0 0 240px; 
    order: 2;
  }
  .grid-panel { 
    flex: 1 1 320px; 
    max-width: 400px;
  }
  #player-panel { order: 1; }
  .grid-panel:last-child { order: 3; }
  .character-panel, .grid-panel {
    background: #111;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 10px;
    width: 100%;
    box-sizing: border-box;
  }
  #kenji-img, #final-video {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  #iso-canvas {
    width: 100% !important;
    max-width: 100%;
    height: auto !important;
    display: block;
    margin: 0 auto;
    background: #0d1117;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .grid-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.85rem;
    flex-wrap: wrap;
    gap: 4px;
  }
  .dialogue-box {
    margin-top: 8px;
    padding: 8px 10px;
    background: #1a1a1a;
    border-left: 3px solid #ff6b6b;
    border-radius: 6px;
    font-style: italic;
    color: #ffcccc;
    font-size: 0.9rem;
    text-align: left;
  }
  .stage-label { color: #ffd700; font-weight: bold; text-align: center; margin-top: 6px; }
  .expression-label { color: #aaa; font-size: 0.85rem; text-align: center; }
  button.reset-btn {
    margin-top: 10px;
    padding: 12px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    font-size: 1rem;
  }
  @media (min-width: 700px) {
    .game-container { flex-direction: row; align-items: flex-start; max-width: 900px; gap: 16px; }
    .character-panel, .grid-panel { width: auto; flex: 1; }
    h1 { font-size: 1.6rem; }
    .subtitle { font-size: 0.95rem; }
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 0;
    width: min(480px, 100%);
    aspect-ratio: 1;
    background: url('images/village_map.jpg') center/cover no-repeat;
    border: 2px solid #4a3a2a;
    position: relative;
  }
  .cell {
    aspect-ratio: 1;
    width: 100%;
    cursor: pointer;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .cell:hover { background: rgba(255,255,255,0.12); }
  .cell.hit { background: rgba(34,197,94,0.35); border-color: #22c55e; }
  .cell.miss { background: rgba(0,0,0,0.45); }
  .cell.sunk { background: rgba(239,68,68,0.4); border-color: #ef4444; }
  .cell:hover { filter: brightness(1.25); transform: scale(1.03); }
  .cell.hit { outline: 2px solid #7bed9f; background: #1a5a3a; cursor: default; }
  .cell.miss { filter: grayscale(0.7) brightness(0.6); background: #2a2a2a; cursor: default; }
  .cell.sunk { outline: 2px solid #ff6b6b; box-shadow: 0 0 8px #ff6b6b; background: #5a1a1a; }
  .tile-house { 
    background: url('tiles/house.jpg') center/cover no-repeat; 
  }
  .tile-house::before { content: none; }
  .tile-tree { 
    background: url('tiles/tree.jpg') center/cover no-repeat; 
  }
  .tile-tree::before { content: none; }
  .tile-path { 
    background: url('tiles/path.jpg') center/cover no-repeat; 
  }
  .tile-path::before { content: none; }
  .tile-water { 
    background: url('tiles/water.jpg') center/cover no-repeat; 
  }
  .tile-water::before { content: none; }
  .tile-lantern { 
    background: linear-gradient(135deg, #1a1520, #2a1a28); 
  }
  .tile-lantern::before { content: "🏮"; font-size: 1.1rem; }
  .tile-bamboo { 
    background: linear-gradient(135deg, #0f1a12, #1a2a1a); 
  }
  .tile-bamboo::before { content: "🎋"; font-size: 1.05rem; }
  .cell {
    background-size: cover;
    background-position: center;
    image-rendering: pixelated;
  }
  .status {
    font-size: 1.2rem;
    margin: 10px 0;
    min-height: 1.5em;
    text-align: center;
  }
  .score {
    font-size: 1rem;
    color: #7bed9f;
    margin-bottom: 10px;
    text-align: center;
  }
  .log {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #bbb;
    min-height: 40px;
  }
  button.reset-btn {
    margin-top: 12px;
    padding: 10px 18px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  button.reset-btn:hover { background: #c0392b; }
  @media (max-width: 800px) {
    .game-container { flex-direction: column; align-items: center; }
    #kenji-img { max-width: 100%; }
  }
</style>
</head>
<body>

<h1>Kenji's Village Hunt</h1>
<p class="subtitle">Search the night ninja village. Sink the hidden trails to find and strip Kenji.</p>

<div id="title-screen" style="position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:16px;">
  <h1 style="color:#ffd700;margin:0;">Kenji's Village Hunt</h1>
  <p style="color:#aaa;margin:0;">Choose difficulty</p>
  <button onclick="startGame('easy')" style="padding:14px 40px;font-size:1.1rem;background:#2ecc71;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Easy</button>
  <button onclick="startGame('medium')" style="padding:14px 40px;font-size:1.1rem;background:#e67e22;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Medium</button>
</div>

<div class="game-container" id="game-container" style="display:none;">
  <div class="grid-panel" id="player-panel">
    <div class="grid-header"><span style="color:#7bed9f;">Your Ships</span></div>
    <div id="player-grid"></div>
  </div>
  <div class="character-panel">
    <img id="kenji-img" src="images/stages/stage1_clothed.png" alt="Kenji">
    <div class="stage-label" id="stage-label">Stage: Free</div>
    <div class="expression-label" id="expr-label">Expression: Neutral</div>
    <div class="dialogue-box" id="dialogue">Hmph... you won't find me that easily in this village.</div>
  </div>
  <div class="grid-panel">
    <div class="grid-header">
      <span id="status">Click a cell to search</span>
      <span id="score">Ships sunk: 0 / 5</span>
    </div>
    <div id="grid"></div>
    <div class="log" id="log"></div>
    <button class="reset-btn" onclick="resetGame()" style="display:none;" id="reset-btn">New Hunt</button>
    <button class="reset-btn" onclick="viewReward()" style="margin-top:4px;background:#2ecc71;display:none;" id="view-reward-btn">View Reward</button>
  </div>
</div>

<script>
const GRID_SIZE = 10;
const dialogue = {
  start: [
    "Hmph... you won't find me that easily in this village.",
    "Search all you want. I'm still free... for now.",

  ],

  partial: [

  ],

    "Nngh... stop... I can't... ah... fuck, not like this... I'm gonna...!",

    "Nngh... reduced to just my underwear. The fundoshi is all I have.",
    "Ah... only the fundoshi now. Everything else is gone.",
    "Hah... down to my underwear. The guards stripped the rest.",
    "Fuck... the perverted guards finally got me fully naked.",

    "Hah... fully naked in front of these perverted guards..."
  ],

    "Nothing here.",
    "Empty house.",
    "Just a tree.",
    "Wrong trail.",
    "Dead end.",
    "No sign of him.",
    "Just shadows.",
    "Empty path."
  ]
};

let shipsSunk = 0;
let difficulty = 'easy';

function startGame(diff) {
  difficulty = diff;
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  setupMedium();
  resetGame();
}

let playerBoard = [];
let playerShips = [];
let kenjiHits = 0;

function setupMedium() {
  playerBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
  playerShips = [
    { len: 2, hits: 0, sunk: false },
    { len: 2, hits: 0, sunk: false },
    { len: 3, hits: 0, sunk: false },
    { len: 3, hits: 0, sunk: false },
    { len: 4, hits: 0, sunk: false }
  ];
  playerShips.forEach(ship => {
    let placed = false;
    while (!placed) {
      const horizontal = Math.random() < 0.5;
      const row = Math.floor(Math.random() * (horizontal ? GRID_SIZE : GRID_SIZE - ship.len + 1));
      const col = Math.floor(Math.random() * (horizontal ? GRID_SIZE - ship.len + 1 : GRID_SIZE));
      let free = true;
      for (let i = 0; i < ship.len; i++) {
        const r = horizontal ? row : row + i;
        const c = horizontal ? col + i : col;
        if (playerBoard[r][c] !== 0) free = false;
      }
      if (free) {
        ship.cells = [];
        for (let i = 0; i < ship.len; i++) {
          const r = horizontal ? row : row + i;
          const c = horizontal ? col + i : col;
          playerBoard[r][c] = ship;
          ship.cells.push({ r, c });
        }
        placed = true;
      }
    }
  });
  kenjiHits = 0;
  const pg = document.getElementById('player-grid');
  if (pg) {
    pg.style.display = 'grid';
    pg.style.gridTemplateColumns = 'repeat(10, 1fr)';
    pg.style.gap = '1px';
    pg.style.width = '100%';
    pg.style.aspectRatio = '1';
    pg.style.background = '#1a1a1a';
    pg.innerHTML = '';
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.pr = r;
        cell.dataset.pc = c;
        cell.style.border = '1px solid #333';
        cell.style.background = playerBoard[r][c] !== 0 ? 'rgba(100,149,237,0.5)' : 'transparent';
        pg.appendChild(cell);
      }
    }
  }
}

let playerJustActed = false;

function kenjiAttack() {
  if (gameOver) return;
  const skipVoice = playerJustActed;
  playerJustActed = false;
  let attempts = 0;
  while (attempts < 150) {
    let r = Math.floor(Math.random() * GRID_SIZE);
    let c = Math.floor(Math.random() * GRID_SIZE);
    if ((difficulty === 'medium' && Math.random() < 0.75) || (difficulty === 'easy' && Math.random() < 0.4)) {
      for (let i = 0; i < GRID_SIZE && attempts < 150; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          if (playerBoard[i][j] !== 'shot') {
            const near = [[i-1,j],[i+1,j],[i,j-1],[i,j+1]].some(([nr,nc]) =>
              nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE && playerBoard[nr][nc]==='shot');
            if (near) { r = i; c = j; break; }
          }
        }
      }
    }
    if (playerBoard[r][c] !== 'shot') {
      const target = playerBoard[r][c];
      playerBoard[r][c] = 'shot';
      const cell = document.querySelector(`#player-grid [data-pr="${r}"][data-pc="${c}"]`);
      if (target && target !== 0 && target !== 'shot') {
        target.hits++;
        if (cell) cell.style.background = '#ef4444';
        const huntHit = shipsSunk >= 3 ? 'audio/kenji_s4_hunt_hit1.mp3' : shipsSunk >= 2 ? 'audio/kenji_s3_hunt_hit1.mp3' : shipsSunk >= 1 ? 'audio/kenji_s2_hunt_hit1.mp3' : 'audio/kenji_hunt_hit1.mp3';
        playAudioFile(huntHit, 0.9);
        if (target.hits === target.len) {
          target.sunk = true;
          kenjiHits++;
          if (!skipVoice) {
            const huntSink = shipsSunk >= 4 ? 'audio/kenji_s5_hunt_sink1.mp3' : shipsSunk >= 3 ? 'audio/kenji_s4_hunt_sink1.mp3' : shipsSunk >= 2 ? 'audio/kenji_s3_hunt_sink1.mp3' : shipsSunk >= 1 ? 'audio/kenji_s2_hunt_sink1.mp3' : 'audio/kenji_hunt_sink1.mp3';
            playAudioFile(huntSink, 0.9);
          }
          logEl.innerHTML += `<br>Kenji sunk one of your ships! (${kenjiHits}/5)`;
          if (kenjiHits >= 5) { kenjiWins(); return; }
        }
      } else {
        if (cell) cell.style.background = 'rgba(0,0,0,0.4)';
      }
      break;
    }
    attempts++;
  }
}

function kenjiWins() {
  gameOver = true;
  unlockAudio();
  statusEl.innerHTML = '<strong>Kenji escaped!</strong>';
  statusEl.style.color = '#ff6b6b';
  const victorySrc = shipsSunk >= 3 ? 'audio/kenji_victory_late.mp3' : 'audio/kenji_victory_early.mp3';
  const a = new Audio(victorySrc);
  a.volume = 0.95;
  a.play().catch(() => playAudioFile(victorySrc, 0.95));
  dialogueEl.textContent = shipsSunk >= 3 ? 'Fuck... that was too close. I need to relax after this.' : 'Hah... got the intelligence. You were too slow.';
  img.src = 'images/stages/stage1_clothed.png';
  stageLabel.textContent = 'Kenji Wins';
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;color:#fff;text-align:center;padding:20px;';
  overlay.innerHTML = `
    <h2 style="color:#ffd700;">Kenji Escaped!</h2>
    <p>He found the intelligence and got away.</p>
    <p style="font-style:italic;color:#ffcccc;">${shipsSunk >= 3 ? '"That was too close. I need to jerk off later just to calm down."' : '"The scroll is mine. Better luck next time."'}</p>
    <button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;background:#e74c3c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Play Again</button>
  `;
  document.body.appendChild(overlay);
}
let gameOver = false;
let audioUnlocked = false;
let board = [];
let ships = [];
let revealed = [];

const img = document.getElementById('kenji-img');
const stageLabel = document.getElementById('stage-label');
const dialogueEl = document.getElementById('dialogue');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const logEl = document.getElementById('log');
const resetBtn = document.getElementById('reset-btn');
const gridEl = document.getElementById('grid');

const stageImages = [
  'images/stages/stage1_clothed.png',
  'images/stages/stage2_shirtless.png',
  'images/stages/stage3_partial.png',
  'images/stages/stage4_fundoshi.png',
  'images/stages/stage5_nude.png',
  'images/stages/stage6_last_capture.png',
  'images/stages/stage7_reward.png'
];

const audioFiles = {
  start: ['audio/full_s1_sink1.mp3'],
  s1_sink: ['audio/s1_sink_1.mp3', 'audio/s1_sink_2.mp3', 'audio/s1_sink_a.mp3', 'audio/s1_sink_b.mp3'],
  s1_hit: ['audio/s1_hit_1.mp3', 'audio/s1_hit_2.mp3', 'audio/s1_hit_3.mp3', 'audio/s1_hit_4.mp3', 'audio/full_s1_hit1.mp3'],
  s2_sink: ['audio/s2_sink_1.mp3', 'audio/s2_sink_2.mp3', 'audio/s2_sink_3.mp3', 'audio/s2_sink_4.mp3'],
  s2_hit: ['audio/s2_hit_1.mp3', 'audio/s2_hit_2.mp3', 'audio/s2_hit_3.mp3', 'audio/s2_hit_4.mp3'],
  s3_sink: ['audio/s3_sink_1.mp3', 'audio/s3_sink_2.mp3', 'audio/s3_sink_3.mp3', 'audio/s3_sink_4.mp3'],
  s3_hit: ['audio/s3_hit_1.mp3', 'audio/s3_hit_2.mp3', 'audio/s3_hit_3.mp3', 'audio/s3_hit_4.mp3', 'audio/s3_hit_5.mp3', 'audio/s3_hit_6.mp3', 'audio/s3_hit_7.mp3', 'audio/s3_hit_8.mp3'],
  s4_sink: ['audio/s4_sink_1.mp3', 'audio/s4_sink_2.mp3', 'audio/s4_sink_3.mp3', 'audio/s4_sink_4.mp3', 'audio/s4_fundoshi_sink.mp3'],
  s4_hit: ['audio/s4_hit_1.mp3', 'audio/s4_hit_2.mp3', 'audio/s4_hit_3.mp3', 'audio/s4_hit_4.mp3'],
  s5_sink: ['audio/s5_sink_1.mp3', 'audio/s5_sink_2.mp3', 'audio/s5_sink_3.mp3', 'audio/s5_sink_4.mp3', 'audio/s5_naked_sink.mp3'],
  s5_hit: ['audio/s5_hit_1.mp3', 'audio/s5_hit_2.mp3', 'audio/s5_hit_3.mp3', 'audio/s5_hit_4.mp3'],
  capture: ['audio/capture_1.mp3', 'audio/capture_2.mp3', 'audio/capture_3.mp3', 'audio/capture_4.mp3', 'audio/capture_5.mp3', 'audio/capture_6.mp3', 'audio/capture_7.mp3', 'audio/capture_8.mp3'],

  kenji_hunt_sink: ['audio/kenji_hunt_sink1.mp3', 'audio/kenji_hunt_sink2.mp3', 'audio/kenji_hunt_sink3.mp3', 'audio/kenji_hunt_sink4.mp3', 'audio/kenji_hunt_sink5.mp3', 'audio/kenji_hunt_sink6.mp3'],
  medium_reward: ['audio/medium_reward_1.mp3', 'audio/medium_reward_2.mp3', 'audio/medium_reward_3.mp3', 'audio/medium_reward_4.mp3', 'audio/medium_reward_5.mp3']
};

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const a = new Audio();
  a.volume = 0;
  a.play().catch(() => {});
}

function playAudioFile(src, volume = 0.9) {
  if (!audioUnlocked) unlockAudio();
  const a = new Audio(src);
  a.volume = volume;
  a.play().catch(err => console.log('Audio failed:', src, err));
}

function playSwordSlice() {
  if (!audioUnlocked) unlockAudio();
  playAudioFile('audio/sword_slice.mp3', 0.8);
}

function slashAnimation() {
  img.style.transition = 'filter 0.1s, transform 0.15s';
  img.style.filter = 'brightness(1.6) contrast(1.2)';
  img.style.transform = 'scale(1.03)';
  setTimeout(() => {
    img.style.filter = '';
    img.style.transform = '';
  }, 180);
}

function playDialogueSound(category, isReward = false) {
  if (audioFiles[category] && audioFiles[category].length) {
    const file = audioFiles[category][Math.floor(Math.random() * audioFiles[category].length)];
    playAudioFile(file, 0.9);
  }
  if (isReward) {
    setTimeout(() => playAudioFile('audio/orgasm.mp3', 0.95), 7000);
  }
}

function randomLine(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function showDialogue(lines, category) {
  dialogueEl.textContent = randomLine(lines);
  playDialogueSound(category);
}

function createBoard() {
  board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
  ships = [
    { len: 2, hits: 0, sunk: false },
    { len: 2, hits: 0, sunk: false },
    { len: 3, hits: 0, sunk: false },

    { len: 4, hits: 0, sunk: false }

  ships.forEach(ship => {
    let placed = false;
    while (!placed) {
      const horizontal = Math.random() < 0.5;
      const row = Math.floor(Math.random() * (horizontal ? GRID_SIZE : GRID_SIZE - ship.len + 1));
      const col = Math.floor(Math.random() * (horizontal ? GRID_SIZE - ship.len + 1 : GRID_SIZE));
      let free = true;
      for (let i = 0; i < ship.len; i++) {
        const r = horizontal ? row : row + i;
        const c = horizontal ? col + i : col;
        if (board[r][c] !== 0) free = false;
      }
      if (free) {
        ship.cells = [];
        for (let i = 0; i < ship.len; i++) {
          const r = horizontal ? row : row + i;
          const c = horizontal ? col + i : col;
          board[r][c] = ship;
          ship.cells.push({ r, c });
        }
        placed = true;
      }
    }
  });
  revealed = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
}

function buildGrid() {
  if (!gridEl) return;
  gridEl.innerHTML = '';
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.onclick = () => clickCell(r, c);
      gridEl.appendChild(cell);
    }
  }
}

try {
  createBoard();
  buildGrid();
  updateImage();
  updateScore();
  showDialogue(dialogue.start, 'start');
} catch (e) {
  console.error('Init error:', e);
  if (gridEl) gridEl.innerHTML = '<div style="color:#f66;padding:10px;">Grid failed to load. Refresh the page.</div>';
}

function clickCell(r, c) {
  unlockAudio();
  if (gameOver || revealed[r][c]) return;

  const target = board[r][c];
  const cell = gridEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);

  if (target === 0) {
    revealed[r][c] = 'miss';
    if (cell) cell.classList.add('miss');
    statusEl.textContent = 'Miss';
    statusEl.style.color = '#aaa';
    showDialogue(dialogue.miss, 'miss');
    logEl.textContent = `Miss`;
    if (!gameOver) {
      setTimeout(kenjiAttack, difficulty === "medium" ? 200 : 350);
    }
  } else {
    revealed[r][c] = 'hit';
    if (cell) cell.classList.add('hit');
    target.hits++;
    statusEl.textContent = 'Hit!';
    statusEl.style.color = '#7bed9f';
    logEl.textContent = `Hit`;

    if (target.hits === target.len && !target.sunk) {
      target.sunk = true;
      shipsSunk++;
      if (shipsSunk < 5) {
        playSwordSlice();
        slashAnimation();
      }
      target.cells.forEach(pos => {
        revealed[pos.r][pos.c] = 'sunk';
        const sunkCell = gridEl.querySelector(`[data-r="${pos.r}"][data-c="${pos.c}"]`);
        if (sunkCell) sunkCell.classList.add('sunk');
      });
      if (shipsSunk >= 5) {
        endGame();
      } else {
        updateImage();
        const stageNum = Math.min(shipsSunk + 1, 5);
        const sinkKey = shipsSunk === 3 ? 's4_sink' : shipsSunk === 4 ? 's5_sink' : `s${stageNum}_sink`;
        showDialogue(dialogue.hit, sinkKey);
        playerJustActed = true;
      }
    } else {
      // On non-sinking hits, still use the current stage's less-confident lines
      const stageNum = Math.min(shipsSunk + 1, 5);
      showDialogue(dialogue.hit, `s${stageNum}_hit`);
      playerJustActed = true;
    }
    updateScore();
    if (!gameOver) {
      setTimeout(kenjiAttack, difficulty === "medium" ? 200 : 350);
    }
  }
}

function updateImage() {
  const idx = Math.min(shipsSunk, stageImages.length - 1);
  img.src = stageImages[idx];
  stageLabel.textContent = shipsSunk >= 5 ? 'Stage: Captured' : `Stage: ${shipsSunk + 1}`;
}

function updateScore() {
  scoreEl.textContent = `Ships sunk: ${shipsSunk} / 5`;
}

function endGame() {
  gameOver = true;
  statusEl.innerHTML = '<strong>Kenji captured!</strong>';
  statusEl.style.color = '#7bed9f';
  resetBtn.style.display = 'block';
  logEl.innerHTML += '<br>Hunt complete.';
  img.src = 'images/stages/stage6_last_capture.png';
  stageLabel.textContent = 'Stage: Captured';
  dialogueEl.textContent = 'Nngh... stop...';
  playDialogueSound('capture');

  const rewardBtn = document.createElement('button');
  rewardBtn.textContent = 'Claim Reward';
  rewardBtn.className = 'reset-btn';
  rewardBtn.style.marginTop = '8px';
  rewardBtn.onclick = () => {
    if (difficulty === 'medium') {
      const rewards = [
        'images/stages/medium_reward_1.png',
        'images/stages/medium_reward_2.png',
        'images/stages/medium_reward_3.png'
      ];
      img.src = rewards[Math.floor(Math.random() * rewards.length)];
      stageLabel.textContent = 'Medium Reward';
    } else {
      img.src = 'images/stages/stage7_reward.png';
      stageLabel.textContent = 'Easy Reward';
    }
    dialogueEl.textContent = 'Ahh...';
    if (difficulty === 'medium') playMediumReward(); else if (difficulty === 'medium') playMediumReward(); else playDialogueSound('reward', true);
    rewardBtn.remove();
  };
  resetBtn.parentNode.insertBefore(rewardBtn, resetBtn);
}

function playMediumReward() {
  const lines = audioFiles.medium_reward;
  const line = lines[Math.floor(Math.random() * lines.length)];
  playAudioFile(line, 0.9);
  setTimeout(() => playAudioFile('audio/medium_sex.mp3', 0.9), 4000);
}

function viewReward() {
  if (difficulty === 'medium') {
    const rewards = [
      'images/stages/medium_reward_1.png',
      'images/stages/medium_reward_2.png',
      'images/stages/medium_reward_3.png'
    ];
    img.src = rewards[Math.floor(Math.random() * rewards.length)];
    stageLabel.textContent = 'Medium Reward';
  } else {
    img.src = 'images/stages/stage7_reward.png';
    stageLabel.textContent = 'Easy Reward';
  }
  dialogueEl.textContent = 'Ahh...';
  if (difficulty === 'medium') playMediumReward(); else playDialogueSound('reward', true);
}

function resetGame() {
  shipsSunk = 0;
  gameOver = false;
  kenjiHits = 0;
  statusEl.textContent = 'Click a cell to search';
  statusEl.style.color = '#eee';
  logEl.innerHTML = '';
  resetBtn.style.display = 'none';
  const viewBtn = document.getElementById('view-reward-btn');
  if (viewBtn) viewBtn.style.display = 'none';
  createBoard();
  buildGrid();
  setupMedium();
  updateImage();
  updateScore();
  showDialogue(dialogue.start, 'start');
  const overlay = document.querySelector('div[style*="z-index:200"]');
  if (overlay) overlay.remove();
}

createBoard();
buildGrid();
updateImage();
updateScore();
showDialogue(dialogue.start, 'start');
</script>
